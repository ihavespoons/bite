[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bite"
version = "0.0.1"
description = "Extreme (1-bit/ternary) quantization pipeline for MoE LLMs (Qwen3.6-35B-A3B)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

# GPU / model stages are installed on the cloud runner, not needed for the CPU-testable core.
[project.optional-dependencies]
model = [
    "transformers>=4.57",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "datasets>=3.0",
]
# GatedDeltaNet fast-path kernel for block-wise QAD. The torch fallback recurrence is NOT
# autograd-safe (mutates the saved [B,H,d,d] delta-rule state in-place -> breaks backward through
# DeltaNet blocks); flash-linear-attention's Triton chunk kernel is backward-safe. It's a pure
# Triton/Python install (no CUDA compile) — kept separate from `train` so the block-wise pass
# (plain AdamW) needn't pull deepspeed/bitsandbytes and hit their torch-version conflicts. The
# short-conv stays on the autograd-safe torch fallback (causal-conv1d's source build mismatched
# the image's nvcc vs the torch it pulled).
qad = ["flash-linear-attention>=0.1"]
train = [
    "deepspeed>=0.15",
    "bitsandbytes>=0.44",  # 8-bit Adam: client optimizer under ZeRO-3 (end-to-end QAD)
    "psutil",              # host-memory telemetry at load milestones (shared-page-cache check)
    "safetensors>=0.4",    # mmap checkpoint init (assign-load) + repro
]
# pinned so the FP16 baseline and later quantized evals use the identical harness (apples-to-apples
# % retained). 0.4.12's humaneval task is broken (missing pass_at_k) -> excluded in configs.
# langdetect/immutabledict/nltk are ifeval's runtime deps (not pulled by lm-eval core).
eval = [
    "lm-eval==0.4.12",
    "typing_extensions>=4.13",  # PEP 728 extra_items on py<3.13
    "langdetect",
    "immutabledict",
    "nltk",
]
export = ["hqq>=0.2"]  # 4-bit vision tower
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["bite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
