[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bite"
version = "0.0.1"
description = "Extreme (1-bit/ternary) quantization pipeline for MoE LLMs (Qwen3.6-35B-A3B)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

# GPU / model stages are installed on the cloud runner, not needed for the CPU-testable core.
[project.optional-dependencies]
model = [
    "transformers>=4.57",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "datasets>=3.0",
]
train = [
    "deepspeed>=0.15",
    "bitsandbytes>=0.44",  # 8-bit optimizer for the end-to-end polish pass
    # GatedDeltaNet fast-path kernels. The torch fallback recurrence is not autograd-safe
    # (mutates the saved [B,H,d,d] state in-place -> breaks backward through DeltaNet blocks
    # during QAD); these Triton/CUDA kernels are backward-safe and required to heal the
    # DeltaNet-hosted MoE/attention weights.
    "flash-linear-attention>=0.1",
    "causal-conv1d>=1.4",
]
# pinned so the FP16 baseline and later quantized evals use the identical harness (apples-to-apples
# % retained). 0.4.12's humaneval task is broken (missing pass_at_k) -> excluded in configs.
# langdetect/immutabledict/nltk are ifeval's runtime deps (not pulled by lm-eval core).
eval = [
    "lm-eval==0.4.12",
    "typing_extensions>=4.13",  # PEP 728 extra_items on py<3.13
    "langdetect",
    "immutabledict",
    "nltk",
]
export = ["hqq>=0.2"]  # 4-bit vision tower
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["bite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
