[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bite"
version = "0.0.1"
description = "Extreme (1-bit/ternary) quantization pipeline for MoE LLMs (Qwen3.6-35B-A3B)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

# GPU / model stages are installed on the cloud runner, not needed for the CPU-testable core.
[project.optional-dependencies]
model = [
    "transformers>=4.57",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "datasets>=3.0",
]
train = [
    "deepspeed>=0.15",
    "bitsandbytes>=0.44",  # 8-bit optimizer for the end-to-end polish pass
]
# pinned so the FP16 baseline and later quantized evals use the identical harness (apples-to-apples
# % retained). 0.4.12's humaneval task is broken (missing pass_at_k) -> excluded in configs.
eval = ["lm-eval==0.4.12", "typing_extensions>=4.13"]  # 4.13 for PEP 728 extra_items on py<3.13
export = ["hqq>=0.2"]  # 4-bit vision tower
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["bite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
