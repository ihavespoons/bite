# Binary {-1,+1} g128 — the 1-bit goal (~1.125 bpw), shippable as the fork's Q1_0. Re-init
# from the healed ternary checkpoint; fall back to expert-level mixed precision if it collapses.
defaults: base.yaml
quant:
  mode: binary
qad:
  init_from: outputs/ternary/healed  # start from the recovered ternary model
