# Shared defaults. ternary.yaml / binary.yaml override `quant.mode`.
model:
  id: Qwen/Qwen3.6-35B-A3B
  dtype: bfloat16
  device_map: auto

moe:
  num_experts: 256
  routed_experts: 8      # + 1 shared
  # keep router gate + shared expert in higher precision (see bite/quant/policy.py)

quant:
  mode: ternary          # ternary | binary
  # g128 matches the PrismML fork's Q2_0 (ternary) and Q1_0 (binary) blocks, so healed ==
  # shipped and 1-bit is runnable (Stage 0 finding #6). Mainline-only runs would use g64.
  group_size: 128        # FP16 scale per group
  clip_ste: false
  # null = BitNet absmean rounding; float = fixed TWN threshold ratio; "optimal" = exact
  # per-group MSE-optimal support (sort + cumsum closed form). On Gaussian weights optimal
  # cuts weight MSE ~28% vs absmean; validating on the real model via eval_quant --rules.
  ternary_threshold: null

calibration:
  dataset: null          # HF dataset id (null -> allenai/c4 en, streamed)
  text_field: text       # column holding raw text
  seq_len: 2048          # packed sequence length
  tokens: 2_000_000
  oversample_tail: true  # oversample rarely-fired experts (2nd-pass, TODO)

ptq:
  percdamp: 0.01

qad:
  schedule: blockwise    # blockwise | end_to_end
  layers_path: null      # dotted path to the decoder ModuleList; null = auto-detect longest
  block_steps: 200       # optimizer steps per block in the block-wise pass
  teacher_topk: 64       # precomputed teacher logits kept per token
  temperature: 1.0
  tokens: 1_500_000_000  # ~1.5B; scale only if the eval curve is still climbing
  optimizer: adam8bit    # end_to_end polish uses bitsandbytes 8-bit optimizer
  lr: 1.0e-4
  loss_weights: { kl: 1.0, hidden: 1.0, ce: 0.5 }
  distill_router: true
  freeze_router: true

eval:
  # humaneval dropped: broken in current lm-eval (humaneval/utils.py missing pass_at_k).
  # Add a code benchmark (mbpp / fixed lm-eval) later. These 3 need no code execution.
  tasks: [gsm8k, mmlu, ifeval]              # reasoning / knowledge / instruction-following
  batch_size: 8                            # fixed, not "auto": 248K vocab overflows 32-bit index at large batch
  # FP16 reference from job baseline-v4 (full: datasets/ihavespoons/bite-baseline).
  # MMLU (loglikelihood) is the PRIMARY degradation signal: robust, high headroom.
  # gsm8k/ifeval below are the *non-chat* config. Applying the chat template made gsm8k WORSE
  # (0.0 strict) — this thinking model emits verbose <think> CoT that truncates before the
  # answer and doesn't match gsm8k's regex (job baseline-chat -> baseline_chat.json). A true
  # generative baseline would need think-aware extraction + 4k gen toks; deferred as orthogonal.
  # Compare quantized models on MMLU primarily; gsm8k/ifeval non-chat are secondary references.
  teacher_baseline:
    mmlu: 0.8393
    gsm8k_strict: 0.2790
    gsm8k_flexible: 0.3010
    ifeval_prompt_strict: 0.3401
    ifeval_inst_strict: 0.4724

vision:
  quantize: true
  nbits: 4               # HQQ
  group_size: 64

export:
  out_dir: outputs/gguf
  runtime: prism-fork    # PrismML-Eng/llama.cpp @ prism; g128 Q1_0/Q2_0 (Stage 0 finding #6)
  gguf_type: { ternary: Q2_0, binary: Q1_0 }   # both run on the fork (CUDA/Metal/CPU/Vulkan)
  components: [lm, mmproj, mtp]   # LM low-bit + vision mmproj + MTP/DSpark drafter (finding #2)
  # the fork's stock quantize auto-bumps some tensors to Q4_K when n_expert>=4; override to
  # hold the end-to-end low-bit target (no high-precision escape hatch) — validate in Stage 0 spike
  end_to_end_lowbit: true
